<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 휴일 일과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container">
  <div class="card" style="max-width: 460px;">
    <h1>🌺 나의 휴일 일과</h1>

    <div class="section">
      <h2>🍏 아침</h2>
      <p><span class="time">10:00 -</span> ⏰ <mark>알람 없이</mark> 일어나기</p>
      <p><span class="time">10:30 -</span> 🍳 아침 먹기</p>
      <p><span class="time">08:50 -</span> ☕ 커피 마시기</p>
    </div>

    <div class="section">
      <h2>☀️ 오후 활동</h2>
      <p><span class="time">13:00 -</span> 💤 집에서 쉬기</p>
      <p><span class="time">14:30 -</span> 📷 가족들과 시간 보내기</p>
      <p><span class="time">16:00 -</span> 📱 유튜브 보거나 인스타 하기</p>
    </div>

    <div class="section">
      <h2>🌃 저녁</h2>
      <p><span class="time">18:00 -</span> 🍕 친구들과 저녁 먹기</p>
      <p><span class="time">20:00 -</span> 🎬 드라마 또는 <mark>넷플릭스</mark> 감상</p>
      <p><span class="time">23:00 -</span> 🛁 힐링 타임</p>
    </div>

    <p class="footer">🗓️ 휴일 버전 작성일: 2026년 7월</p>
  </div>
</div>

</body>
</html>
